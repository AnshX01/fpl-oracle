name: CI Pipeline - FPL Oracle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Typecheck Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e .

      - name: Run Ruff Lint Checks
        run: |
          ruff check src tests scripts

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check src tests scripts

      - name: Run Mypy Type Analysis
        run: |
          mypy src/fpl_oracle

  test-and-verify:
    name: Test Suite & Offline Fixtures
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-anyio hypothesis
          pip install -e .

      - name: Verify Secret Audit
        run: |
          python scripts/check_secrets.py

      - name: Run Pytest Suite with Offline Fixtures
        run: |
          pytest tests -v -W ignore::DeprecationWarning
