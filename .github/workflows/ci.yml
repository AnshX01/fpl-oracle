name: CI Pipeline - FPL Oracle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly run for slow test target (~33 min) at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Typecheck Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.10 mypy==2.4.0
          pip install -e ".[dev]"

      - name: Run Ruff Lint Checks
        run: |
          ruff check src tests scripts

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check src tests scripts

      - name: Run Mypy Type Analysis (Full Scope)
        run: |
          mypy src

  test-and-verify:
    name: Test Suite & Security Checks
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-anyio

      - name: Verify Secret Audit
        run: |
          python scripts/check_secrets.py

      - name: Run Pytest Default Suite (not slow)
        run: |
          pytest -m "not slow"

  slow-suite-nightly:
    name: Slow Integration Suite (~33 min Nightly / Pre-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-anyio

      - name: Run Pytest Slow Suite
        run: |
          pytest -m "slow"

