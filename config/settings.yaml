# FPL Oracle - Global Application Settings
# Every key below is read by src/fpl_oracle (config.SETTINGS).

cache:
  bootstrap_ttl_seconds: 300
  live_gw_ttl_seconds: 60
  summary_ttl_seconds: 1800
  fixtures_ttl_seconds: 900

fpl:
  base_url: "https://fantasy.premierleague.com/api"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36 FPLOracle/1.0"
  max_concurrency: 5
  request_timeout_seconds: 15
  rate_limit_delay_seconds: 0.15

optimizer:
  discount_factor: 0.95  # Multi-period temporal discount factor fitted from 2023-26 seasons (WI-2.1)
  hit_penalty: 4.0  # Official FPL rule: -4 points per additional transfer (verified in tests/test_hit_policy.py)
  ft_option_value: 1.80  # Free transfer preservation option value (Hall of Fame heuristic: ~1.75-2.0 pts)
  anti_churn_penalty: 0.50  # Lateral transfer friction penalty (anti-churn)
  cameo_risk_penalty: 0.75  # 5-minute cameo risk penalty on starting lineup selection
  eo_hedge_weight: 0.80  # Points discount per 100% unhedged consensus EO divergence (Hall of Fame Feature 1)
  differential_captain_hurdle: 1.20  # Minimum raw xP margin needed to bet against consensus captain (>100% EO)
  turnaround_drag: 0.85  # Expected minutes discount for players with <72h turnaround after 75+ midweek minutes

advisor:
  price_rise_ev_value: 0.08  # Long-term points value of £0.1m purchasing power
  injury_risk_ev_damage: 4.5  # Expected points loss from an unannounced midweek training injury
  overperformance_xg_threshold: 2.5  # Flags chasing past points if G - xG >= 2.5 over recent matches
  underperformance_xgi_threshold: 0.55  # Flags rage-selling if player has >= 0.55 xGI/90 but 0 recent returns


