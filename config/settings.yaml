# FPL Oracle - Global Application Settings
# Every threshold carries a backtest or rule citation justifying its value (WI-7.1).

server:
  host: "127.0.0.1"
  port: 8000
  reload: false

storage:
  db_url: "sqlite:///data/fpl_oracle.db"
  cache_dir: "data/cache"
  snapshots_dir: "data/snapshots"
  models_dir: "data/models"

cache:
  bootstrap_ttl_seconds: 300
  live_gw_ttl_seconds: 60
  summary_ttl_seconds: 1800
  fixtures_ttl_seconds: 900

fpl:
  base_url: "https://fantasy.premierleague.com/api"
  target_league_id: 435956  # IceMakers League
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36 FPLOracle/1.0"
  max_concurrency: 5
  request_timeout_seconds: 15
  rate_limit_delay_seconds: 0.15

manager_profile:
  entry_id: 1085141
  target_league_id: 435956  # IceMakers League
  goal: "win_league"
  risk_preference: "balanced"

ml:
  horizon_gameweeks: 8  # 8-gameweek maximum lookahead (justified by fixture difficulty scheduling)
  min_minutes_filter: 90  # 90 minutes minimum sample for player rate calculations
  quantile_alpha_low: 0.10  # P10 pessimistic floor (CQR calibrated, WI-3.8)
  quantile_alpha_high: 0.90  # P90 explosive ceiling (CQR calibrated, WI-3.8)
  rolling_windows: [3, 5, 8]  # Short, medium, long decay origins
  expanding_cv_min_gws: 10  # Minimum origin gameweeks before expanding cross-validation

optimizer:
  default_horizon: 5  # 5-GW rolling planning window balancing fixture visibility vs horizon noise (WI-2.1)
  discount_factor: 0.95  # Multi-period temporal discount factor fitted from 2023-26 seasons (WI-2.1)
  max_hits: 2  # Hard ceiling on extra transfers per single gameweek (WI-2.2)
  hit_penalty: 4.0  # Official FPL rule: -4 points per additional transfer (verified in tests/test_hit_policy.py)
  solver_name: "PULP_CBC_CMD"  # Standard CBC open-source branch-and-cut solver
  max_solve_time_seconds: 60  # Maximum time budget per multi-period solve on host machine (WI-2.4)
  threads: 4  # CBC solver parallelism

chips:
  first_set_deadline_gw: 19  # Official 2026/27 rule: hard expiry for Set 1 chips at GW19 deadline (tests/test_f007_chip_expiry.py)
  max_chips_per_gameweek: 1  # Official 2026/27 rule: exactly 1 chip per gameweek (Rule R2)
  gw1_free_hit_forbidden: true  # Official 2026/27 rule: Free Hit forbidden in GW1 (Rule R2)
  consecutive_fh_forbidden: true  # Official 2026/27 rule: No Free Hit in GW20 if Free Hit played in GW19 (Rule R2)

llm:
  default_provider: "gemini"
  temperature: 0.2
  max_output_tokens: 2048
