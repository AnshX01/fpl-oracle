season: "2026/27"

squad:
  total_players: 15
  squad_play: 11
  bench_size: 4
  positions:
    GKP:
      id: 1
      select: 2
      min_play: 1
      max_play: 1
    DEF:
      id: 2
      select: 5
      min_play: 3
      max_play: 5
    MID:
